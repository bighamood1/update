[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nmu-rag"
version = "2.0.0"
description = "Local grounded RAG assistant for New Mansoura University (PHASE 2)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
    "sentence-transformers==3.3.1",
    "chromadb>=1.5",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.28",
    "numpy>=1.26,<2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ollama>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that require external services (Ollama, model downloads)",
]
